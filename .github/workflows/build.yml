name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # امضای ثابت بین ساخت‌ها تا نسخه تازه روی قبلی نصب شود
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E -A3 'error:|^e: |What went wrong' build.log | head -40 |
              awk '{printf "%s%%0A", $0} END {print ""}' | sed 's/^/::error::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rahyab-apk
          path: app/build/outputs/apk/debug/app-debug.apk
